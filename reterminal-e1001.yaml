spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
  interface: hardware

text_sensor:
  - platform: mqtt_subscribe
    id: daily_json
    topic: ${topic}/daily_forecast
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: |-
            for (int i = 0; i < 5; i++) {
              id(d_day)[i][0] = '\0';
              id(d_cond)[i] = 255;
              id(d_hi)[i] = NAN;
              id(d_lo)[i] = NAN;
            }
            id(daily_ok) = false;

            auto doc = parse_json(x);
            if (doc.isNull()) {
              ESP_LOGW("forecast", "daily payload did not parse: %s", x.c_str());
              return;
            }

            // keep in sync with icon_for() in the display lambda
            auto cond_code = [](const char *c) -> uint8_t {
              std::string s(c);
              if (s == "sunny") return 0;
              if (s == "partlycloudy") return 1;
              if (s == "cloudy") return 2;
              if (s == "rainy") return 3;
              if (s == "snowy") return 4;
              if (s == "pouring") return 5;
              if (s == "lightning") return 6;
              if (s == "clear-night") return 7;
              if (s == "night-partlycloudy") return 8;
              if (s == "fog") return 9;
              if (s == "hail") return 10;
              if (s == "lightning-rainy") return 11;
              if (s == "snowy-rainy") return 12;
              if (s == "windy") return 13;
              if (s == "windy-variant") return 14;
              return 255;
            };

            int i = 0;
            for (JsonObjectConst o : doc.as<JsonArrayConst>()) {
              if (i >= 5) break;
              const char *day = o["d"].isNull() ? "" : o["d"].as<const char *>();
              strncpy(id(d_day)[i].data(), day, id(d_day)[i].size() - 1);
              id(d_day)[i][id(d_day)[i].size() - 1] = '\0';
              id(d_cond)[i] = o["c"].isNull() ? 255 : cond_code(o["c"].as<const char *>());
              id(d_hi)[i] = o["h"].isNull() ? NAN : o["h"].as<float>();
              id(d_lo)[i] = o["l"].isNull() ? NAN : o["l"].as<float>();
              i++;
            }
            id(daily_ok) = (i == 5);
            ESP_LOGI("forecast", "parsed %d daily entries", i);

  - platform: mqtt_subscribe
    id: hourly_json
    topic: ${topic}/hourly_forecast
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: |-
            for (int i = 0; i < 12; i++) {
              id(h_time)[i][0] = '\0';
              id(h_cond)[i] = 255;
              id(h_temp)[i] = NAN;
              id(h_prec)[i] = NAN;
              id(h_wind)[i] = NAN;
            }
            id(hourly_ok) = false;

            auto doc = parse_json(x);
            if (doc.isNull()) {
              ESP_LOGW("forecast", "hourly payload did not parse: %s", x.c_str());
              return;
            }

            // keep in sync with icon_for() in the display lambda
            auto cond_code = [](const char *c) -> uint8_t {
              std::string s(c);
              if (s == "sunny") return 0;
              if (s == "partlycloudy") return 1;
              if (s == "cloudy") return 2;
              if (s == "rainy") return 3;
              if (s == "snowy") return 4;
              if (s == "pouring") return 5;
              if (s == "lightning") return 6;
              if (s == "clear-night") return 7;
              if (s == "night-partlycloudy") return 8;
              if (s == "fog") return 9;
              if (s == "hail") return 10;
              if (s == "lightning-rainy") return 11;
              if (s == "snowy-rainy") return 12;
              if (s == "windy") return 13;
              if (s == "windy-variant") return 14;
              return 255;
            };

            int i = 0;
            for (JsonObjectConst o : doc.as<JsonArrayConst>()) {
              if (i >= 12) break;
              const char *t = o["t"].isNull() ? "" : o["t"].as<const char *>();
              strncpy(id(h_time)[i].data(), t, id(h_time)[i].size() - 1);
              id(h_time)[i][id(h_time)[i].size() - 1] = '\0';
              id(h_cond)[i] = o["c"].isNull() ? 255 : cond_code(o["c"].as<const char *>());
              id(h_temp)[i] = o["p"].isNull() ? NAN : o["p"].as<float>();
              id(h_prec)[i] = o["r"].isNull() ? NAN : o["r"].as<float>();
              id(h_wind)[i] = o["w"].isNull() ? NAN : o["w"].as<float>();
              i++;
            }
            id(hourly_ok) = (i == 12);
            ESP_LOGI("forecast", "parsed %d hourly entries", i);

  - platform: mqtt_subscribe
    id: prevent_sleep
    topic: ${topic}/prevent_sleep
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: |-
            if (x == "on") {
              id(deep_sleep_1).prevent_deep_sleep();
            } else {
              id(deep_sleep_1).allow_deep_sleep();
            }

  - platform: mqtt_subscribe
    id: date_str_id
    topic: ${topic}/date
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: 'id(date_str) = x;'

  - platform: mqtt_subscribe
    id: last_update_str_id
    topic: ${topic}/last_update
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: 'id(last_update_str) = x;'

sensor:
  - platform: sht4x
    id: sht40_sensor
    address: 0x44
    temperature:
      name: "ReTerminal Room Temperature"
      id: sht4x_temp
      accuracy_decimals: 1
      internal: true
      state_topic: ${topic}/status/room_temperature
      retain: true
    humidity:
      name: "ReTerminal Room Humidity"
      id: sht4x_hum
      accuracy_decimals: 0
      internal: true
      state_topic: ${topic}/status/room_humidity
      retain: true
    update_interval: never

  - platform: template
    name: "Last Wake Duration"
    id: last_run_duration
    unit_of_measurement: s
    accuracy_decimals: 1
    device_class: duration
    state_class: measurement
    icon: mdi:timer-outline
    update_interval: never
    internal: true
    state_topic: ${topic}/status/last_wake_duration
    retain: true
    lambda: |-
      if (id(last_run_ms) == 0)
        return {};
      return id(last_run_ms) / 1000.0f;

  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: never
    attenuation: 12db
    internal: true
    state_topic: ${topic}/status/battery_voltage
    retain: true
    filters:
      - multiply: 2.0
    on_value:
      then:
        - component.update: battery_level

  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    internal: true
    state_topic: ${topic}/status/battery_level
    retain: true
    lambda: |-
      if (std::isnan(id(battery_voltage).state) || id(battery_voltage).state < 2.0f)
        return {};
      return id(battery_voltage).state;
    update_interval: never
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    name: "Signal WiFi ReTerminal"
    id: wifi_signal_strength
    update_interval: never
    internal: true
    state_topic: ${topic}/status/wifi_signal
    retain: true

  - platform: internal_temperature
    name: "ReTerminal Chip Temperature"
    id: chip_temperature
    update_interval: never
    internal: true
    state_topic: ${topic}/status/chip_temperature
    retain: true

  - platform: template
    id: wifi_quality
    internal: true
    state_topic: null
    lambda: 'return id(wifi_signal_strength).state;'
    update_interval: never
    filters:
      - calibrate_linear:
          - -30 -> 100.0
          - -50 -> 90.0
          - -60 -> 75.0
          - -67 -> 60.0
          - -70 -> 50.0
          - -80 -> 25.0
          - -90 -> 10.0
          - -100 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: mqtt_subscribe
    id: outdoor_temperature_id
    topic: ${topic}/outdoor_temperature
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: 'id(outdoor_temp) = x;'

  - platform: mqtt_subscribe
    id: outdoor_humidity_id
    topic: ${topic}/outdoor_humidity
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: 'id(outdoor_hum) = x;'

  - platform: mqtt_subscribe
    id: indoor_upper_temperature_id
    topic: ${topic}/indoor_upper
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: 'id(indoor_upper_temp) = x;'

  - platform: mqtt_subscribe
    id: indoor_lower_temperature_id
    topic: ${topic}/indoor_lower
    internal: true
    state_topic: null
    on_value:
      then:
        - lambda: 'id(indoor_lower_temp) = x;'

script:
  - id: draw_and_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(painted);'
          then:
            - script.stop: draw_and_sleep
      # only a sync wake (every 10th, or any wake before we've ever gotten valid
      # data) connects to wifi/mqtt; wait for this cycle's fresh payloads before
      # drawing. Plain 1-minute clock ticks skip this and draw from the persisted
      # globals.
      - if:
          condition:
            lambda: 'return id(is_sync_wake);'
          then:
            - wait_until:
                condition:
                  lambda: |-
                    return id(date_str_id).has_state() && id(last_update_str_id).has_state()
                        && id(daily_ok) && id(hourly_ok)
                        && id(outdoor_temperature_id).has_state() && !std::isnan(id(outdoor_temperature_id).state)
                        && id(outdoor_humidity_id).has_state() && !std::isnan(id(outdoor_humidity_id).state)
                        && id(indoor_upper_temperature_id).has_state() && !std::isnan(id(indoor_upper_temperature_id).state)
                        && id(indoor_lower_temperature_id).has_state() && !std::isnan(id(indoor_lower_temperature_id).state);
            - component.update: wifi_signal_strength
            - component.update: wifi_quality
            - lambda: 'id(wifi_quality_pct) = id(wifi_quality).state;'
      - lambda: 'id(painted) = true;'
      # Refresh tiers:
      #   every 6h (wake_count % 360 == 0): full_update_every 1 = plain full, ghost-clearing
      #   hourly, and the wake after the 6-hourly one: fast full
      #   otherwise (1 min ticks and 10 min syncs): partial refresh
      # Partial compares against the controller's previous-image RAM, which the
      # driver preserves by skipping the panel deep-sleep command whenever
      # full_update_every > 1. The 6-hourly plain full does deep-sleep the panel
      # (RAM lost), so the next wake is forced back to a full refresh; setup()
      # seeds the counter so a cold/brownout boot also starts with a full one.
      - lambda: |-
          const uint32_t wc = id(wake_count);
          if (wc % 360 == 0) {
            id(epaper_display).set_full_update_every(1);
          } else if (wc % 360 == 1 || wc % 60 == 0) {
            id(epaper_display).set_full_update_every(60);
            id(epaper_display).set_update_count(0);
          } else {
            id(epaper_display).set_full_update_every(60);
          }
      - component.update: epaper_display
      # epaper_spi refreshes asynchronously through its state machine, so wait
      # for the driver to go idle (loop disabled) before cutting power.
      - wait_until:
          condition:
            lambda: 'return id(epaper_display).is_idle();'
          timeout: 30s
      # only sync wakes stamp this - a 1-minute wake's duration would just get
      # overwritten by the next wake anyway, so the only value worth publishing
      # is how long the last network (10min/1h) wake actually took.
      - if:
          condition:
            lambda: 'return id(is_sync_wake);'
          then:
            - lambda: 'id(last_run_ms) = millis();'
      # Correction only: on the 6-hourly wake give sntp up to 10s to sync, so its
      # on_time_sync trigger writes the RTC. Bounded and skipped the moment it
      # has synced; the other sync wakes never wait for it.
      - if:
          condition:
            lambda: 'return id(wake_count) % 360 == 0;'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(sntp_synced);'
                timeout: 10s
      - if:
          condition:
            lambda: 'return id(prevent_sleep).state != "on";'
          then:
            - deep_sleep.enter: deep_sleep_1
          else:
            - logger.log: "prevent_sleep is on - staying awake"

display:
  # Integrated-board model supplies cs=10, dc=11, reset=12, busy=13 (inverted,
  # pulled up) and 800x480; only non-default options are set here.
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1001
    update_interval: never
    lambda: |-

      // keep in sync with cond_code() in the daily_json/hourly_json parsers
      auto icon_for = [](uint8_t c) -> const char * {
        switch (c) {
          case 0: return "\U000F0599";   // sunny
          case 1: return "\U000F0595";   // partlycloudy
          case 2: return "\U000F0590";   // cloudy
          case 3: return "\U000F0597";   // rainy
          case 4: return "\U000F0598";   // snowy
          case 5: return "\U000F0596";   // pouring
          case 6: return "\U000F0593";   // lightning
          case 7: return "\U000F0594";   // clear-night
          case 8: return "\U000F0F31";   // night-partlycloudy
          case 9: return "\U000F0591";   // fog
          case 10: return "\U000F0592";  // hail
          case 11: return "\U000F067E";  // lightning-rainy
          case 12: return "\U000F0F35";  // snowy-rainy
          case 13: return "\U000F059D";  // windy
          case 14: return "\U000F059E";  // windy-variant
          default: return "\U000F0F2F";  // exceptional / unknown
        }
      };

      int base_x, base_y;
      int text_width, x_offset, baseline, height;
      char buffer[25];

      // HEADER: live clock (left) then date, split by a drawn tick (no font glyph needed).
      // Ticks every wake, even the networkless ones, since the ESP32's RTC keeps counting
      // through deep sleep.
      auto now = id(sntp_time).now();
      char time_buf[8];
      if (now.is_valid()) {
        // round to the nearest minute rather than truncate - the label holds for
        // a full ~60s wake cycle, so rounding halves the worst-case drift (up to
        // 59s late near a boundary) down to ~30s either side
        int display_hour = now.hour;
        int display_minute = now.minute;
        if (now.second >= 30) {
          display_minute++;
          if (display_minute == 60) {
            display_minute = 0;
            display_hour = (display_hour + 1) % 24;
          }
        }
        snprintf(time_buf, sizeof(time_buf), "%02d:%02d", display_hour, display_minute);
      } else {
        snprintf(time_buf, sizeof(time_buf), "--:--");
      }
      it.printf(8, 11, id(myFont26), id(black), "%s", time_buf);
      id(myFont26).measure(time_buf, &text_width, &x_offset, &baseline, &height);
      int tick_x = 8 + text_width + 16;
      it.filled_rectangle(tick_x, 12, 2, 24, id(black));
      it.printf(tick_x + 16, 11, id(myFont26), id(black), "%s", id(date_str).c_str());

      // STATUS CLUSTER (top right): battery, then wifi - right-aligned, gaps measured not guessed
      int cursor_x = 792;

      float battery_percent = id(battery_level).state;
      const char *battery_icon = battery_percent >= 60 ? "\U000F12A3"
                                : battery_percent >= 30 ? "\U000F12A2"
                                                         : "\U000F12A1";
      snprintf(buffer, sizeof(buffer), "%.0f%%", battery_percent);
      id(myFont26).measure(buffer, &text_width, &x_offset, &baseline, &height);
      int battery_text_x = cursor_x - text_width;
      it.printf(battery_text_x, 11, id(myFont26), id(black), "%s", buffer);
      id(icon_font_26).measure(battery_icon, &text_width, &x_offset, &baseline, &height);
      int battery_icon_x = battery_text_x - 4 - text_width;
      it.printf(battery_icon_x, 11, id(icon_font_26), id(black), "%s", battery_icon);

      cursor_x = battery_icon_x - 12;

      float wifi_percent = id(wifi_quality_pct);
      const char *wifi_icon;
      if (wifi_percent >= 75) {
        wifi_icon = "\U000F0928";
      } else if (wifi_percent >= 60) {
        wifi_icon = "\U000F0925";
      } else if (wifi_percent >= 40) {
        wifi_icon = "\U000F0922";
      } else if (wifi_percent >= 20) {
        wifi_icon = "\U000F091F";
      } else if (wifi_percent > 0) {
        wifi_icon = "\U000F092B";
      } else {
        wifi_icon = "\U000F092E";
      }
      snprintf(buffer, sizeof(buffer), "%.0f%%", wifi_percent);
      id(myFont26).measure(buffer, &text_width, &x_offset, &baseline, &height);
      int wifi_text_x = cursor_x - text_width;
      it.printf(wifi_text_x, 11, id(myFont26), id(black), "%s", buffer);
      id(icon_font_26).measure(wifi_icon, &text_width, &x_offset, &baseline, &height);
      int wifi_icon_x = wifi_text_x - 4 - text_width;
      it.printf(wifi_icon_x, 11, id(icon_font_26), id(black), "%s", wifi_icon);

      // divider 1: closes off the header
      it.filled_rectangle(8, 46, 784, 2, id(black));

      // OUTDOOR TEMPERATURE / OUTDOOR HUMIDITY / INDOOR AVG TEMPERATURE
      base_x = 8;
      base_y = 64;

      float indoor_avg_temperature = (id(indoor_upper_temp) + id(indoor_lower_temp)) / 2.0f;

      it.printf(base_x, base_y, id(icon_font_50), id(black), "\U000F18D7");
      it.printf(base_x+64, base_y, id(myFont52), id(black), "%.1f°", id(outdoor_temp));
      it.printf(base_x, base_y+84, id(icon_font_50), id(black), "\U000F058E");
      it.printf(base_x+64, base_y+84, id(myFont52), id(black), "%.0f%%", id(outdoor_hum));
      it.printf(base_x, base_y+168, id(icon_font_50), id(black), "\U000F0F55");
      it.printf(base_x+64, base_y+168, id(myFont52), id(black), "%.1f°", indoor_avg_temperature);

      // divider 2: separates the readings column from the 5-day forecast, full band height
      it.filled_rectangle(244, 46, 2, 254, id(black));

      // DAILY FORECAST
      for (int i = 0; i < 5; i++) {
        const char *icon = icon_for(id(d_cond)[i]);

        base_x = 264 + 106*i;
        base_y = 70;
        id(myFont26).measure(id(d_day)[i].data(), &text_width, &x_offset, &baseline, &height);
        int x_jour = base_x + (106 - text_width) / 2;
        id(icon_font_80).measure(icon, &text_width, &x_offset, &baseline, &height);
        int x_icon = base_x + (106 - text_width) / 2;
        snprintf(buffer, sizeof(buffer), "%.0f", id(d_hi)[i]);
        id(myFont26).measure(buffer, &text_width, &x_offset, &baseline, &height);
        int x_temp_max = base_x + (106 - text_width) / 2;
        snprintf(buffer, sizeof(buffer), "%.0f", id(d_lo)[i]);
        id(myFont26).measure(buffer, &text_width, &x_offset, &baseline, &height);
        int x_temp_min = base_x + (106 - text_width) / 2;

        it.printf(x_jour, base_y, id(myFont26), id(black), "%s", id(d_day)[i].data());
        it.printf(x_icon, base_y+34, id(icon_font_80), id(black), "%s", icon);
        it.printf(x_temp_max, base_y+150, id(myFont26), id(black), "%.0f°", id(d_hi)[i]);
        it.printf(x_temp_min, base_y+178, id(myFont26), id(black), "%.0f°", id(d_lo)[i]);
      }

      // divider 3: closes off the today/5-day block
      it.filled_rectangle(8, 300, 784, 2, id(black));

      // HOURLY FORECAST
      base_x = 8;
      base_y = 309;
      it.printf(base_x, base_y+62, id(icon_font_20), id(black), "\U000F1442");  // time
      it.printf(base_x, base_y+86, id(icon_font_20), id(black), "\U000F050F");  // temperature
      it.printf(base_x, base_y+110, id(icon_font_20), id(black), "\U000F058C"); // precipitation
      it.printf(base_x, base_y+134, id(icon_font_20), id(black), "\U000F059D"); // wind speed

      for (int i = 0; i < 12; i++) {
        const char *icon = icon_for(id(h_cond)[i]);

        base_x = 32 + 63*i;
        id(icon_font_50).measure(icon, &text_width, &x_offset, &baseline, &height);
        int x_icon = base_x + (63 - text_width) / 2;
        it.printf(x_icon, base_y, id(icon_font_50), id(black), "%s", icon);

        // Right-aligned column values (63px column width, right border at base_x + 61)
        id(myFont16).measure(id(h_time)[i].data(), &text_width, &x_offset, &baseline, &height);
        int x_time = base_x + 61 - text_width;
        it.printf(x_time, base_y+62, id(myFont16), id(black), "%s", id(h_time)[i].data());

        snprintf(buffer, sizeof(buffer), "%.0f°", id(h_temp)[i]);
        id(myFont16).measure(buffer, &text_width, &x_offset, &baseline, &height);
        int x_temp = base_x + 61 - text_width;
        it.printf(x_temp, base_y+86, id(myFont16), id(black), "%s", buffer);

        snprintf(buffer, sizeof(buffer), "%.0f%%", id(h_prec)[i]);
        id(myFont16).measure(buffer, &text_width, &x_offset, &baseline, &height);
        int x_precip = base_x + 61 - text_width;
        it.printf(x_precip, base_y+110, id(myFont16), id(black), "%s", buffer);

        if (!std::isnan(id(h_wind)[i])) {
          snprintf(buffer, sizeof(buffer), "%.0fkm/h", id(h_wind)[i]);
        } else {
          snprintf(buffer, sizeof(buffer), "-");
        }
        id(myFont14).measure(buffer, &text_width, &x_offset, &baseline, &height);
        int x_wind = base_x + 61 - text_width;
        it.printf(x_wind, base_y+134, id(myFont14), id(black), "%s", buffer);
      }

deep_sleep:
  id: deep_sleep_1
  run_duration: 45s
  sleep_duration: 60s
  wakeup_pin:
    - pin:
        number: GPIO3
        mode:
          input: true
          pullup: true
        inverted: true
        ignore_strapping_warning: true
  wakeup_pin_mode: INVERT_WAKEUP
