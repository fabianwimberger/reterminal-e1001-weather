substitutions:
  name: reterminal-e1001
  friendly_name: reTerminal E1001
  # MQTT topic prefix; must match the Home Assistant automations
  topic: home/reterminal
  sntp_server: pool.ntp.org

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -10
    then:
      # Seed the system clock from the on-board RTC before anything reads time,
      # so the draw never waits for sntp and every wake has a valid clock.
      - pcf8563.read_time: rtc_time
      - output.turn_on: bsp_battery_enable
      - delay: 10ms
      - component.update: battery_voltage
      - output.turn_off: bsp_battery_enable
      # wake cadence: every wake ticks the clock; every 10th wake (10 min) pulls
      # fresh data over wifi/mqtt. A wake also forces a sync regardless of the
      # counter if we don't have valid data yet - otherwise a fresh flash sits
      # on NaN/blank fields until the counter happens to align.
      - lambda: |-
          id(wake_count) += 1;
          // decided once, up front - outdoor_temp mutates mid-boot once a forced
          // sync succeeds, so re-deriving this later would silently flip it
          id(is_sync_wake) = (id(wake_count) % 10 == 0) || std::isnan(id(outdoor_temp)) || id(force_ota_sync);
          if (id(force_ota_sync)) {
            id(force_ota_sync) = false;
            ESP_LOGI("wake", "post-OTA boot - forcing sync wake");
          }
          ESP_LOGI("wake", "wake #%u  sync=%d", id(wake_count), (int) id(is_sync_wake));
      - if:
          condition:
            lambda: 'return id(is_sync_wake);'
          then:
            # these three are MQTT-only diagnostics (not drawn on screen) and
            # can't publish without a connection anyway, so skip the I2C/sensor
            # reads entirely on the networkless 1-minute wakes
            - component.update: sht40_sensor
            - component.update: chip_temperature
            - component.update: last_run_duration
            - wifi.enable
          else:
            - script.execute: draw_and_sleep

# Shadows the built-in epaper_spi with the local fork that adds
# set_update_count() and seeds the counter from the reset reason, so a
# deep-sleep wake can start with a partial refresh. Remove this block and
# external_components/ once the change is upstreamed.
external_components:
  - source:
      type: local
      path: external_components
    components: [epaper_spi]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  # ESP32-S3 defaults to USB_SERIAL_JTAG, which collides with the I2C pins
  # (GPIO19/20) and never reaches the CH340; this board logs over UART0.
  hardware_uart: UART0
  level: ERROR

json:

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - deep_sleep.prevent: deep_sleep_1
    on_end:
      then:
        - lambda: 'id(force_ota_sync) = true;'

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  birth_message:
  will_message:
  reboot_timeout: 0s
  enable_on_boot: false
  on_connect:
    then:
      - script.execute: draw_and_sleep

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  fast_connect:
    enabled: true
    storage: rtc
  # A static IP skips DHCP, which is a large share of every sync wake
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet
    dns1: !secret dns
  on_connect:
    then:
      - mqtt.enable
  output_power: 15dBm

time:
  # On-board NXP PCF8563 (I2C 0x51). Read once at boot in on_boot so the system
  # clock is valid on every wake without waiting for the network; sntp corrects
  # it and writes it back when it syncs on the 6-hourly wake.
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    update_interval: never
  - platform: sntp
    id: sntp_time
    servers:
      - ${sntp_server}
    update_interval: 1h
    on_time_sync:
      then:
        - lambda: 'id(sntp_synced) = true;'
        - if:
            condition:
              lambda: 'return id(wake_count) % 360 == 0;'
            then:
              - pcf8563.write_time: rtc_time

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

color:
  # In ink for epaper_spi (1 bit = white), so text drawn with this is black.
  - id: black
    hex: '000000'

globals:
  # persists across every deep-sleep reboot (RestoringGlobalsComponent, NVS-backed)
  - id: wake_count
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  # set right before the post-OTA reboot, consumed once by the next on_boot -
  # forces that boot to be a sync wake so the device stays on wifi/mqtt long
  # enough to confirm the update (or take another one) instead of going
  # straight back to a networkless sleep
  - id: force_ota_sync
    type: bool
    restore_value: yes
    initial_value: 'false'

  # decided once per boot in on_boot, reused everywhere else in that boot - not
  # persisted, and must not be re-derived later since outdoor_temp mutates once
  # a forced sync succeeds
  - id: is_sync_wake
    type: bool
    restore_value: no
    initial_value: 'false'

  # Set by the sntp on_time_sync trigger. The system clock is already valid from
  # the RTC, so this is the only way to tell whether sntp itself has synced; the
  # 6-hourly wake waits on it (bounded) to let the RTC be corrected.
  - id: sntp_synced
    type: bool
    restore_value: no
    initial_value: 'false'

  # Condition strings can't survive a restore_value round-trip (std::string isn't
  # trivially copyable), so daily/hourly weather condition is kept as a small
  # numeric code instead - see cond_code()/icon_for() below. Day/time labels use
  # fixed-size char buffers for the same reason.
  - id: d_day
    type: std::array<std::array<char, 5>, 5>
    restore_value: yes
  - id: d_cond
    type: std::array<uint8_t, 5>
    restore_value: yes
  - id: d_hi
    type: std::array<float, 5>
    restore_value: yes
  - id: d_lo
    type: std::array<float, 5>
    restore_value: yes

  - id: h_time
    type: std::array<std::array<char, 6>, 12>
    restore_value: yes
  - id: h_cond
    type: std::array<uint8_t, 12>
    restore_value: yes
  - id: h_temp
    type: std::array<float, 12>
    restore_value: yes
  - id: h_prec
    type: std::array<float, 12>
    restore_value: yes
  - id: h_wind
    type: std::array<float, 12>
    restore_value: yes

  # last sync's readings, held across the networkless 1-minute clock-only wakes
  - id: outdoor_temp
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: outdoor_hum
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: indoor_upper_temp
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: indoor_lower_temp
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: wifi_quality_pct
    type: float
    restore_value: yes
    initial_value: 'NAN'

  - id: date_str
    type: std::string
    restore_value: yes
  - id: last_update_str
    type: std::string
    restore_value: yes

  - id: daily_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: hourly_ok
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: painted
    type: bool
    restore_value: no
    initial_value: 'false'

  # Written before sleeping and reported on the next wake
  - id: last_run_ms
    type: uint32_t
    restore_value: yes
    initial_value: '0'

font:
