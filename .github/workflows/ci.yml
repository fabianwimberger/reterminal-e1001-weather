name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Validate config
        run: |
          cp secrets.yaml.example secrets.yaml
          esphome config reterminal-e1001.yaml

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install esphome
      - uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('reterminal-e1001.yaml', 'external_components/**') }}
          restore-keys: |
            ${{ runner.os }}-esphome-
      - name: Compile firmware
        run: |
          cp secrets.yaml.example secrets.yaml
          esphome compile reterminal-e1001.yaml
