name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Validate config
        run: |
          cp secrets.yaml.example secrets.yaml
          esphome config reterminal-e1001.yaml
